<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VoltCheck — Inspection station</title>
    <meta
      name="description"
      content="Vehicle inspections, recorded evidence and certificates."
    />
    <link
      rel="preload"
      href="fonts/DM-Sans.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="stationHeader">
        <a class="brand" href="#" aria-label="VoltCheck"
          >voltcheck<span class="brandtag">Station</span></a
        >
        <nav id="stationNav" aria-label="Main navigation">
          <button data-view="workspace" class="nav active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m4 10 8-7 8 7v11h-6v-7h-4v7H4z" /></svg
            ><span>Inspect</span></button
          ><button data-view="records" class="nav">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 3h9l4 4v14H6zM10 11h5M10 15h5M14 3v5h5" /></svg
            ><span>Records</span></button
          ><button data-view="catalogue" class="nav">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M3 15h18M5 15l2-8h10l2 8M5 15v5M19 15v5M7 7l1-3h8l1 3"
              /></svg
            ><span>Vehicles</span></button
          ><button data-view="setup" class="nav">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m14 6 4-3 3 3-3 4-4-1-7 11-4-3 8-9z" /></svg
            ><span>Settings</span>
          </button>
        </nav>
        <div class="header-actions">
          <button
            id="connection"
            class="device-status"
            data-action="connect"
            aria-label="Connect device"
          >
            <span class="status-dot"></span
            ><span class="connection-label">Connect device</span></button
          ><button
            id="mobileNavToggle"
            type="button"
            aria-label="Toggle navigation"
            aria-controls="stationNav"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M4 8h16M4 16h16" />
            </svg>
          </button>
        </div>
      </aside>
      <div class="main">
        <main id="app">
          <div class="initial-loading" aria-label="Loading station">
            <span></span><span></span><span></span>
          </div>
        </main>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
    <dialog id="modal">
      <button id="closeModal" class="dialog-close" aria-label="Close dialog">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      <div id="modalContent"></div>
    </dialog>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
